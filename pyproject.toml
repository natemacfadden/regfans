[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "regfans"
version = "0.1.1"
description = "A Python library for computing regular triangulations of lattice vector configurations"
authors = [{ name = "Nate MacFadden" }]
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-flint",
    "ortools",
    "networkx",
    "numpy",
    "scipy",
    "triangulumancer>=0.3",
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
  "pplpy",
  "pytest"
]

[project.urls]
Repository = "https://github.com/natemacfadden/regfans"
Documentation = "https://github.com/natemacfadden/regfans/blob/main/documentation/api.md"
Issues = "https://github.com/natemacfadden/regfans/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
