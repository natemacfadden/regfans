name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}        # login shell; setup-miniconda activates the env here
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: regfans
      - name: Install regfans
        run: conda run -n regfans pip install -e .
      - name: Run tests
        run: conda run -n regfans pytest -v

  docs-drift:
    name: api.md up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pydoc-markdown parses source statically, so no project deps are needed;
      # pin the version so generated output is deterministic across runs
      - name: Install pydoc-markdown
        run: pip install "pydoc-markdown==4.8.2"
      - name: Regenerate api.md
        run: |
          pydoc-markdown
          python documentation/clean_api.py
      - name: Fail if api.md is out of date
        run: |
          if ! git diff --quiet -- documentation/api.md; then
            echo "::error::documentation/api.md is stale -- run 'pydoc-markdown && python documentation/clean_api.py' and commit the result"
            git diff -- documentation/api.md
            exit 1
          fi
