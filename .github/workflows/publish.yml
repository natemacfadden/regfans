name: Deploy

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v6
        with:
          name: ci-sdist
          path: dist/*.tar.gz

  # regfans ships a C extension (the grow4d backend), so wheels are platform-
  # and interpreter-tagged: one `build --wheel` on ubuntu would emit a bare
  # linux_x86_64 wheel, which PyPI rejects, and would cover one Python only.
  # cibuildwheel builds the manylinux/macOS matrix instead.
  make-wheel:
    name: Make Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]   # linux x86_64, macOS x86_64, macOS arm64
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/cibuildwheel@v2.21.3
        env:
          # PyPy has no numpy/Cython story here, and musllinux is untested
          CIBW_SKIP: "pp* *-musllinux_*"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-wheel-${{ matrix.os }}   # artifact names must be unique
          path: wheelhouse/*.whl

  deploy-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [make-sdist, make-wheel]
    environment:
      name: pypi
      url: https://pypi.org/p/regfans
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          pattern: ci-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
